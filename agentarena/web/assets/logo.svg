<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Radial Glow -->
    <radialGradient id="arenaBgGlow" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#1E1B4B" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#0F172A" stop-opacity="1"/>
      <stop offset="100%" stop-color="#050811" stop-opacity="1"/>
    </radialGradient>

    <!-- Main Shield & Arena Neon Gradient -->
    <linearGradient id="neonGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>

    <linearGradient id="cyanAccent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>

    <linearGradient id="goldStar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <!-- Drop Shadows & Glow Filters -->
    <filter id="coreGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- 1. Background Rounded Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#arenaBgGlow)"/>
  <rect width="510" height="510" x="1" y="1" rx="111" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>

  <!-- 2. Arena Stadium Outer Orbit Ring (Benchmarking Ring) -->
  <ellipse cx="256" cy="256" rx="190" ry="190" fill="none" stroke="url(#neonGradient)" stroke-width="3" stroke-dasharray="14 10" opacity="0.45"/>
  <circle cx="256" cy="256" r="160" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="24"/>

  <!-- 3. Outer Hexagonal Shield (Security & Robustness Benchmark) -->
  <path d="M 256,76 
           L 384,142 
           L 384,302 
           L 256,428 
           L 128,302 
           L 128,142 Z"
        fill="rgba(15, 23, 42, 0.75)"
        stroke="url(#neonGradient)"
        stroke-width="7"
        stroke-linejoin="round"
        filter="url(#softShadow)"/>

  <!-- Inner Hexagon Contour with subtle fill -->
  <path d="M 256,104 
           L 358,156 
           L 358,286 
           L 256,390 
           L 154,286 
           L 154,156 Z"
        fill="rgba(30, 27, 75, 0.45)"
        stroke="rgba(139, 92, 246, 0.3)"
        stroke-width="2"
        stroke-linejoin="round"/>

  <!-- 4. Neural CoT / Trajectory Nodes & Connections (Side-by-Side Arena) -->
  <g stroke="rgba(99, 102, 241, 0.4)" stroke-width="3">
    <!-- Connecting neural lines -->
    <line x1="174" y1="210" x2="256" y2="160"/>
    <line x1="338" y1="210" x2="256" y2="160"/>
    <line x1="174" y1="210" x2="210" y2="290"/>
    <line x1="338" y1="210" x2="302" y2="290"/>
    <line x1="210" y1="290" x2="256" y2="346"/>
    <line x1="302" y1="290" x2="256" y2="346"/>
  </g>

  <!-- Left Contender Node (Baseline Agent) -->
  <circle cx="174" cy="210" r="14" fill="#1E293B" stroke="#64748B" stroke-width="4"/>
  <circle cx="174" cy="210" r="6" fill="#94A3B8"/>

  <!-- Right Contender Node (Candidate Agent) -->
  <circle cx="338" cy="210" r="14" fill="#1E1B4B" stroke="#06B6D4" stroke-width="4" filter="url(#coreGlow)"/>
  <circle cx="338" cy="210" r="6" fill="#22D3EE"/>

  <!-- 5. Central AI Core / Arena Hub (Stylized Hex-Chip + Trophy Diamond) -->
  <g transform="translate(256, 246)">
    <!-- Central Glow Ring -->
    <circle r="46" fill="rgba(99, 102, 241, 0.15)" filter="url(#coreGlow)"/>

    <!-- Microchip Base -->
    <rect x="-34" y="-34" width="68" height="68" rx="16" fill="#0F172A" stroke="url(#neonGradient)" stroke-width="4.5"/>

    <!-- Central Benchmarking Balance/Scale Star Diamond -->
    <path d="M 0,-20 L 14,0 L 0,20 L -14,0 Z" fill="url(#cyanAccent)"/>
    <circle cx="0" cy="0" r="4.5" fill="#FFFFFF"/>

    <!-- Microchip Connector Pins (4 directions) -->
    <line x1="-34" y1="-12" x2="-44" y2="-12" stroke="#6366F1" stroke-width="3" stroke-linecap="round"/>
    <line x1="-34" y1="12" x2="-44" y2="12" stroke="#6366F1" stroke-width="3" stroke-linecap="round"/>
    <line x1="34" y1="-12" x2="44" y2="-12" stroke="#EC4899" stroke-width="3" stroke-linecap="round"/>
    <line x1="34" y1="12" x2="44" y2="12" stroke="#EC4899" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- 6. Arena Top Laurel / Star of Excellence (Benchmark Trophy Crown) -->
  <g transform="translate(256, 126)">
    <polygon points="0,-12 4,-3 13,-2 6,5 8,14 0,9 -8,14 -6,5 -13,-2 -4,-3" fill="url(#goldStar)"/>
  </g>

  <!-- 7. Trajectory Path Arc & Metric Checkmarks -->
  <path d="M 210,346 Q 256,368 302,346" fill="none" stroke="#10B981" stroke-width="4" stroke-linecap="round"/>
  <circle cx="256" cy="358" r="4" fill="#34D399"/>
</svg>
